---
layout: default
---
<article class="reading-page blog-post">
  <header class="article-heading">
    <a class="back-link" href="{{ '/archives/' | relative_url }}"><span aria-hidden="true">←</span> Writing</a>
    <h1>{{ page.title }}</h1>
    <p class="article-description">{{ page.description }}</p>
    <div class="article-meta"><span>{{ site.social.name }}</span><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time><span>{{ content | strip_html | number_of_words | divided_by: 200 | plus: 1 }} minute read</span></div>
  </header>
  <div class="prose">{{ content }}</div>
  <footer class="article-footer"><a class="text-link" href="{{ '/archives/' | relative_url }}"><span aria-hidden="true">←</span> All writing</a><a class="text-link" href="{{ '/' | relative_url }}">See what I'm building <span aria-hidden="true">↗</span></a></footer>
</article>

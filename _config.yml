title: Arsalan Ahmad
tagline: Software engineer and builder
description: >-
  Arsalan Ahmad, software engineer and builder based in Tallinn, Estonia.
  Building Forkee and Dakia, with consultancy and commercial projects through Mashal Tech.
url: "https://arsalan.me"
baseurl: ""
lang: en
timezone: Europe/Tallinn

github:
  username: ArsalanDotMe
twitter:
  username: ArsalanDotMe
social:
  name: Arsalan Ahmad
  email: contact@arsalan.me
  links:
    - https://github.com/ArsalanDotMe
    - https://www.linkedin.com/in/ahmadarsalan
    - https://twitter.com/ArsalanDotMe

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

collections:
  tabs:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page

kramdown:
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
  - docs
  - README.md
  - LICENSE
  - "package*.json"
